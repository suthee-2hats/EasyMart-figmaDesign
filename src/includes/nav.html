<div class="overlay"></div>

<!-- Header Navigation -->
<nav
    id="main-navigation"
    class="header-navigation"
    aria-label="Main navigation"
>

    <!-- Location -->
    <div class="header-location">

        <img src="../assets/img/icons/Location.svg" width="24" height="24">

        <span>
            10115 New York
        </span>

        <button
            type="button"
            class="location-toggle"
            aria-label="Change location"
        >
        <img src="../assets/img/icons/LocationArrowDown.svg" width="14" height="14">
        </button>

    </div>


    <!-- Search -->
    <form
    class="header-search"
    role="search"
    action="#"
    method="get"
>
    <div class="header-search_inside">

        <label class="sr-only" for="header-search">
            Search products
        </label>

        <div class="search-icon_image">
            <img
                src="../assets/img/icons/searchIcon32px.svg"
                alt="search icon"
                width="32"
                height="32"
            >
        </div>

        <input
            type="search"
            id="header-search"
            name="search"
            placeholder="Search by product name"
            autocomplete="off"
        >

    </div>

    <!-- Search dropdown -->
    <div class="search-dropdown">

        <!-- Popular searches, shown when the input is empty -->
        <div class="search-dropdown__popular">

            <p class="search-dropdown__title">
                Popular Search <span aria-hidden="true">⚡</span>
            </p>

            <div class="search-dropdown__list">

                <button type="button" class="search-dropdown__item">
                    Beef
                </button>

                <button type="button" class="search-dropdown__item">
                    Rice
                </button>

                <button type="button" class="search-dropdown__item">
                    Fresh bakery
                </button>

                <button type="button" class="search-dropdown__item">
                    Fruits
                </button>

            </div>
        </div>

        <!-- Product results, filled in by header-search.js as the user types -->
        <div
            class="search-dropdown__results"
            aria-live="polite"
            hidden
        ></div>

    </div>

</form>

    <!-- Cart -->
    <a
        href="#"
        class="header-cart"
        aria-label="Shopping cart, 14 items"
    >
       <div class="card-imageAndNumber">
        <img src="../assets/img/icons/Cart.svg" width="20" height="20">

        <span
            class="cart-count"
            aria-hidden="true"
        >
            14
        </span>
       </div>

        <span class="cart-label">
            Cart
        </span>

    </a>


    <!-- Login -->
    <button
    type="button"
    class="header-login"
    id="header-login"
    aria-label="Login to your EasyMart account"
>
    <img
        src="../assets/img/icons/Login.svg"
        alt=""
        width="16"
        height="16"
        id="header-login-image"
    >

    <span id="header-login-name">
        Login
    </span>
</button>

</nav>
