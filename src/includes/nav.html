<div class="overlay"></div>

<!-- Header Navigation -->
<nav
    id="main-navigation"
    class="header-navigation"
    aria-label="Main navigation"
>

    <!-- Location -->
    <div class="header-location">

        <img src="../assets/img/icons/Location.svg" width="24" height="24">

        <span>
            10115 New York
        </span>

        <button
            type="button"
            class="location-toggle"
            aria-label="Change location"
        >
            <i
                class="ion ion-ios-arrow-down"
                aria-hidden="true"
            ></i>
        </button>

    </div>


    <!-- Search -->
    <form
        class="header-search"
        role="search"
        action="#"
        method="get"
    >

        <label
            class="sr-only"
            for="header-search"
        >
            Search products
        </label>

        <i
            class="ion ion-ios-search"
            aria-hidden="true"
        ></i>

        <input
            type="search"
            id="header-search"
            name="search"
            placeholder="Search by product name"
            autocomplete="off"
        >

    </form>


    <!-- Cart -->
    <a
        href="#"
        class="header-cart"
        aria-label="Shopping cart, 14 items"
    >

        <i
            class="ion ion-ios-cart"
            aria-hidden="true"
        ></i>

        <span
            class="cart-count"
            aria-hidden="true"
        >
            14
        </span>

        <span class="cart-label">
            Cart
        </span>

    </a>


    <!-- Login -->
    <a
        href="#"
        class="header-login"
        aria-label="Login to your EasyMart account"
    >

        <i
            class="ion ion-person"
            aria-hidden="true"
        ></i>

        <span>
            Login
        </span>

    </a>

</nav>
