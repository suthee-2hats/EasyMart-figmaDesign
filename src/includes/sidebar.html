<aside
    class="product-filters"
    aria-label="Product filters"
>

    <!-- Filter heading -->
    <div class="product-filters__header">

        <h2 class="product-filters__title">
            Filters
        </h2>

        <button
            type="reset"
            class="product-filters__reset"
            form="product-filter-form"
        >
            Reset
        </button>

    </div>


    <form
        id="product-filter-form"
        class="product-filters__form"
    >

        <!-- Price -->
        <fieldset class="product-filters__group">

            <legend class="product-filters__group-title">
                Price
            </legend>

            <label class="product-filter">
                <input
                    type="radio"
                    name="price"
                    value="all"
                    checked
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    All
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="price"
                    value="0-100"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    Under $100
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="price"
                    value="100-500"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    $100 - $500
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="price"
                    value="500-1000"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    $500 - $1,000
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="price"
                    value="1000-plus"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    $1,000 & Above
                </span>
            </label>

        </fieldset>


        <!-- Discount -->
        <fieldset class="product-filters__group">

            <legend class="product-filters__group-title">
                Discount
            </legend>

            <label class="product-filter">
                <input
                    type="radio"
                    name="discount"
                    value="all"
                    checked
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    All
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="discount"
                    value="10"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    10% & Above
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="discount"
                    value="20"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    20% & Above
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="discount"
                    value="30"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    30% & Above
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="discount"
                    value="50"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    50% & Above
                </span>
            </label>

        </fieldset>


        <!-- Rating -->
        <fieldset class="product-filters__group">

            <legend class="product-filters__group-title">
                Rating
            </legend>

            <label class="product-filter">
                <input
                    type="radio"
                    name="rating"
                    value="all"
                    checked
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    All
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="rating"
                    value="4"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    4 ★ & Above
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="rating"
                    value="3"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    3 ★ & Above
                </span>
            </label>

            <label class="product-filter">
                <input
                    type="radio"
                    name="rating"
                    value="2"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    2 ★ & Above
                </span>
            </label>

        </fieldset>

    </form>


    <!-- User information -->
    <div
        class="product-filters__user"
        aria-label="User information"
    >

        <div class="product-filters__user-image">
            <img
                src=""
                alt=""
                id="filter-user-image"
                width="32"
                height="32"
            >
        </div>

        <div class="product-filters__user-info">
            <span
                class="product-filters__user-name"
                id="filter-user-name"
            >
                Loading...
            </span>
        </div>

    </div>

</aside>
