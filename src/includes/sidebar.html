<aside
    class="product-filters"
    aria-label="Product filters"
>

    <!-- Filter heading -->
    <div class="product-filters__header">

        <h2 class="product-filters__title">
            Filters
        </h2>

        <button
            type="reset"
            class="product-filters__reset"
            form="product-filter-form"
        >
            Reset
        </button>

    </div>


    <form
        id="product-filter-form"
        class="product-filters__form"
    >

        <!-- Quick filters -->
        <fieldset class="product-filters__group">


            <label class="product-filter">
                <input
                    type="checkbox"
                    name="filter"
                    value="deals"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    Deals
                </span>
            </label>


            <label class="product-filter">
                <input
                    type="checkbox"
                    name="filter"
                    value="new-arrivals"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    New Arrivals
                </span>
            </label>


            <label class="product-filter">
                <input
                    type="checkbox"
                    name="filter"
                    value="near-me"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    Near Me
                </span>
            </label>

        </fieldset>


        <!-- Price -->
        <fieldset class="product-filters__group">

            <legend class="product-filters__group-title">
                Price
            </legend>


            <label class="product-filter">

                <input
                    type="radio"
                    name="price"
                    value="all"
                    checked
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    All
                </span>

            </label>


            <label class="product-filter">

                <input
                    type="radio"
                    name="price"
                    value="4-12"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    $4 - $12
                </span>

            </label>


            <label class="product-filter">

                <input
                    type="radio"
                    name="price"
                    value="12-40"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    $12 - $40
                </span>

            </label>


            <label class="product-filter">

                <input
                    type="radio"
                    name="price"
                    value="40-plus"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    $40 & Above
                </span>

            </label>

        </fieldset>


        <!-- Made in -->
        <fieldset class="product-filters__group">

            <legend class="product-filters__group-title">
                Made in
            </legend>


            <label class="product-filter">

                <input
                    type="radio"
                    name="made-in"
                    value="all"
                    checked
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    All
                </span>

            </label>


            <label class="product-filter">

                <input
                    type="radio"
                    name="made-in"
                    value="united-states"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    United States
                </span>

            </label>


            <label class="product-filter">

                <input
                    type="radio"
                    name="made-in"
                    value="canada"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    Canada
                </span>

            </label>


            <label class="product-filter">

                <input
                    type="radio"
                    name="made-in"
                    value="other"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    Other
                </span>

            </label>

        </fieldset>


        <!-- Additional filter -->
        <fieldset class="product-filters__group">

            <legend class="product-filters__group-title">
                Made in
            </legend>


            <label class="product-filter">

                <input
                    type="checkbox"
                    name="additional-filter"
                    value="option-1"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    Remember me
                </span>

            </label>


            <label class="product-filter">

                <input
                    type="checkbox"
                    name="additional-filter"
                    value="option-2"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    Remember me
                </span>

            </label>


            <label class="product-filter">

                <input
                    type="checkbox"
                    name="additional-filter"
                    value="option-3"
                >

                <span
                    class="product-filter__control"
                    aria-hidden="true"
                ></span>

                <span class="product-filter__label">
                    Remember me
                </span>

            </label>

        </fieldset>

    </form>

</aside>
