<!-- Header -->
<header class="header sticky-top">
    <div class="container">

        <div class="header-inner">

            <!-- Mobile Menu Button -->
            <button
                type="button"
                class="menu-mobile-trigger btn"
                aria-label="Open navigation menu"
                aria-controls="main-navigation"
                aria-expanded="false"
            >
                <i
                    class="ion ion-android-menu"
                    aria-hidden="true"
                ></i>
            </button>


            <!-- Logo -->
            <div class="header-item-left">

                <a
                    href="./index.html"
                    class="brand"
                    aria-label="EasyMart home"
                >
                    <img
                        src="../assets/img/icons/logoEasyMart.jpg"
                        width="134"
                        height="32"
                        alt="EasyMart"
                    >
                </a>

            </div>


            <!-- Header Navigation / Controls -->
            <div class="header-item-right">

                <partial src="nav.html"></partial>

            </div>

        </div>

    </div>
</header>
